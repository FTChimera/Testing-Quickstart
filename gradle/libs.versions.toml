[versions]
agp = "8.10.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.14.0"
pedro = "2.1.2"
ftc = "11.0.0"
kotlin = "2.0.21"
coreKtx = "1.12.0"
ivyTelemetry = "1.0.0"
fullPanels = "1.0.12"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
pedroCore = { module = "com.pedropathing:core", version.ref = "pedro" }
pedroFtc = { module = "com.pedropathing:ftc", version.ref = "pedro" }
ftc-robot-core = { group = "org.firstinspires.ftc", name = "RobotCore", version.ref = "ftc" }
ftc-hardware = { group = "org.firstinspires.ftc", name = "Hardware", version.ref = "ftc" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
bylazarFullPanels = { module = "com.bylazar:fullpanels", version.ref = "fullPanels" }
pedro-Ivy = { module = "com.pedropathing:ivy", version.ref = "ivyTelemetry" }
pedro-Telemetry = { module = "com.pedropathing:telemetry", version.ref = "ivyTelemetry" }

[bundles]
ftc = ["ftc-robot-core", "ftc-hardware", "pedroCore", "pedroFtc", "bylazarFullPanels", "pedro-Ivy", "pedro-Telemetry"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

